x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: arbitrage
      POSTGRES_USER: arbitrage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arbitrage -d arbitrage"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    logging: *default-logging
    mem_limit: 768m
    cpus: 0.5
    pids_limit: 256

  migrate:
    build:
      context: .
      target: runtime
    entrypoint: ["alembic"]
    command: ["upgrade", "head"]
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *default-logging
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    entrypoint: ["python"]
    command: ["-m", "pytest", "-q", "-p", "no:cacheprovider"]
    env_file:
      - .env.production
    environment:
      MYPY_CACHE_DIR: /tmp/mypy-cache
      PYTHONPYCACHEPREFIX: /tmp/pycache
      RUFF_CACHE_DIR: /tmp/ruff-cache
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *default-logging
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256

  operator:
    profiles: ["operator"]
    build:
      context: .
      target: runtime
    entrypoint: ["python"]
    working_dir: ${OPERATOR_WORKSPACE:-/workspace}
    user: "${OPERATOR_UID:-1000}:${OPERATOR_GID:-1000}"
    group_add:
      - "${DOCKER_GID:-999}"
    network_mode: host
    env_file:
      - .env.production
    environment:
      ARBITRAGE_DATABASE_HOST_OVERRIDE: 127.0.0.1
      ARBITRAGE_DATABASE_PORT_OVERRIDE: ${ARBITRAGE_DATABASE_PORT_OVERRIDE:-5432}
      ARBITRAGE_EXECUTION_MODE_OVERRIDE: ${ARBITRAGE_EXECUTION_MODE_OVERRIDE:-shadow}
      LIVE_TRADING_CONFIRM: ${LIVE_TRADING_CONFIRM:-NO}
      CI_VERIFIED_COMMIT_SHA: ${CI_VERIFIED_COMMIT_SHA:-}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-labyda_next}
      PYTHONPATH: ${OPERATOR_WORKSPACE:-/workspace}/src
    volumes:
      - .:${OPERATOR_WORKSPACE:-/workspace}
      - /var/run/docker.sock:/var/run/docker.sock
    restart: "no"
    logging: *default-logging
    mem_limit: 768m
    cpus: 0.5
    pids_limit: 128

  bot-clob-hft:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      ARBITRAGE_RELEASE_SHA_FILE: /run/release/release-sha
      CI_VERIFIED_COMMIT_SHA: ${CI_VERIFIED_COMMIT_SHA:-}
      ARBITRAGE_EXECUTION_MODE_OVERRIDE: ${CLOB_HFT_EXECUTION_MODE:-shadow}
      LIVE_TRADING_CONFIRM: ${LIVE_TRADING_CONFIRM:-NO}
    volumes:
      - ./config.production.clob_hft.json:/run/config/config.json:ro
      - ./.runtime/release-sha:/run/release/release-sha:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:9108:9108"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9108/health/ready', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 4
    logging: *default-logging
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256

  bot-quote-arb:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      ARBITRAGE_RELEASE_SHA_FILE: /run/release/release-sha
      CI_VERIFIED_COMMIT_SHA: ${CI_VERIFIED_COMMIT_SHA:-}
      ARBITRAGE_EXECUTION_MODE_OVERRIDE: ${QUOTE_ARB_EXECUTION_MODE:-shadow}
      LIVE_TRADING_CONFIRM: ${LIVE_TRADING_CONFIRM:-NO}
    volumes:
      - ./config.production.quote_arb.json:/run/config/config.json:ro
      - ./.runtime/release-sha:/run/release/release-sha:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:9109:9109"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9109/health/ready', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 4
    logging: *default-logging
    mem_limit: 1280m
    cpus: 1.0
    pids_limit: 256

  prometheus:
    profiles: ["hardening"]
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      bot-clob-hft:
        condition: service_started
      bot-quote-arb:
        condition: service_started
    logging: *default-logging
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128

  alertmanager:
    profiles: ["hardening"]
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ${ALERTMANAGER_CONFIG_FILE:-./ops/alertmanager.example.yml}:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    logging: *default-logging
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128

  postgres-backup:
    profiles: ["hardening"]
    image: postgres:16.6
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      BACKUP_DIR: /var/backups/arbitrage
      BACKUP_METRICS_DIR: /var/lib/node_exporter/textfile
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-21600}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      OFFSITE_BACKUP_DIR: /var/backups/offsite
    entrypoint: ["/bin/bash", "/opt/arbitrage/postgres_backup.sh", "--loop"]
    volumes:
      - ./ops/postgres_backup.sh:/opt/arbitrage/postgres_backup.sh:ro
      - ./ops/postgres_restore_drill.sh:/opt/arbitrage/postgres_restore_drill.sh:ro
      - postgres-backups:/var/backups/arbitrage
      - ${OFFSITE_BACKUP_DIR:-./.runtime/backups}:/var/backups/offsite
      - backup-metrics:/var/lib/node_exporter/textfile
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128

  node-exporter:
    profiles: ["hardening"]
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/var/lib/node_exporter/textfile
    volumes:
      - /:/host:ro,rslave
      - backup-metrics:/var/lib/node_exporter/textfile:ro
    ports:
      - "127.0.0.1:9100:9100"
    logging: *default-logging
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64

volumes:
  postgres-data:
  prometheus-data:
  alertmanager-data:
  postgres-backups:
  backup-metrics:
